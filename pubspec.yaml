name: rz_template_set_1
description: "flutter-plugins-rz-template-set-1 — A Flutter plugin that provides centralized theme configuration with reusable access to color palettes, text styles, and size constants, helping maintain consistent design across Flutter applications."
version: 0.0.1
homepage:

publish_to: none

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  #
  get: ^4.7.3
  iconsax: ^0.0.8
  responsive_builder_kit: ^0.0.7
  #
  rz_library_utilities:
    git:
      url: https://github.com/rzrasel/plugins-flutter-rz-library-utilities.git
      ref: vref-1.0.11
  rz_theme_set_1:
    git:
      url: https://github.com/rzrasel/plugins-flutter-rz-theme-set-1.git
      ref: vref-1.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rzrasel.rz_template_set_1
        pluginClass: RzTemplateSet_1Plugin
      ios:
        pluginClass: RzTemplateSet_1Plugin
      linux:
        pluginClass: RzTemplateSet_1Plugin
      macos:
        pluginClass: RzTemplateSet_1Plugin
      windows:
        pluginClass: RzTemplateSet_1PluginCApi
      web:
        pluginClass: RzTemplateSet_1Web
        fileName: rz_template_set_1_web.dart

  # assets:
